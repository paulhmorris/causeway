name: PR

on:
  pull_request:
    branches:
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ✅ CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: "npm"
      - run: npm ci
      - run: npm run typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
